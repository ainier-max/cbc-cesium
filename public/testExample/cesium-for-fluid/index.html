    <script id="cesium_sandcastle_script">

        (async () => {
            // 初始化
            let viewer;
            const init = async () => {
                Cesium.Ion.defaultAccessToken =
                    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIzNmI0MDRkZi04NzhjLTQyYmMtYjQxOC1iNzc2MDA1MmM4ZjIiLCJpZCI6OTAwMTAsImlhdCI6MTY1MDA3NTM0MX0.mGMDeDFon6i_AOEfTs3pEq30wRCipCWL3O-bzLHswtw";

                viewer = new Cesium.Viewer('sceneContainer', {
                    animation: false,
                    timeline: false,
                    baseLayerPicker: false,
                    homeButton: false,
                    geocoder: false,
                    sceneModePicker: false,
                    navigationHelpButton: false,
                    showStatusBar: false,
                    fullscreenButton: false,
                    shouldAnimate: true,
                    infoBox: false
                });

                // 自定义地形服务
                viewer.terrainProvider = await Cesium.CesiumTerrainProvider.fromUrl('http://211.143.193.121:29091/FJDX', {
                    requestWaterMask: false,
                    requestVertexNormals: true,
                });
                // 配置
                viewer.shadows = true; // 开启阴影
                viewer.resolutionScale = 1.0; // 分辨率
                viewer.scene.msaaSamples = 4; // msaa
                viewer.scene.globe.depthTestAgainstTerrain = true; // 深度测试
                viewer.scene.logarithmicDepthBuffer = true; // log深度
                viewer.scene.highDynamicRange = true;
                viewer.scene.debugShowFramesPerSecond = true;
                viewer.clock.currentTime = Cesium.JulianDate.fromIso8601("2024-12-29T06:00:00Z");


                // // 创建大气 
                viewer.scene.fog.enabled = true;
                viewer.scene.globe.showGroundAtmosphere = false;
                viewer.scene.skyAtmosphere.show = false;
                viewer.scene.globe.enableLighting = true;
                viewer.scene.postProcessStages.add(createSkyEffect());


                let waterFluid;
                let waterSourceHandler;

                // 初始化 viewModel（在点击按钮前就创建）
                const viewModel = {
                    param1: 10,
                    param2: 20,
                    param3: 0,
                    param4: 0.1,
                    waterSourceStrength: 0.03,
                    waterSourceRadius: 0.02,
                    waterDepthColorIntensity: 1.0,
                    boundaryWidth: 10000,
                    boundaryHeight: 10000,
                };
                Cesium.knockout.track(viewModel);
                const toolbar = document.getElementById("toolbar");
                Cesium.knockout.applyBindings(viewModel, toolbar);

                // 更新图例显示的函数（全局定义）
                function updateLegend(intensity) {
                    // shader中: normalizedDepth = waterDepth * intensity * 10.0
                    // 其中 waterDepth 是归一化值 [0,1]
                    // 实际物理水深(米) = waterDepth(归一化) × heightScale(1000m)
                    //
                    // 反推：当 normalizedDepth = 0.33 时
                    // waterDepth(归一化) = 0.33 / (intensity * 10.0)
                    // 实际水深(米) = waterDepth(归一化) × 1000

                    const heightScale = 1000; // dimensions.z = 1000m
                    const factor = intensity * 10.0;

                    const depth1 = (0.33 / factor * heightScale).toFixed(2);  // 蓝->黄分界点
                    const depth2 = (0.66 / factor * heightScale).toFixed(2);  // 黄->橙分界点
                    const depth3 = (1.0 / factor * heightScale).toFixed(2);   // 橙->红分界点

                    document.getElementById('depth-range-1').textContent = `0-${depth1}m`;
                    document.getElementById('depth-range-2').textContent = `${depth1}-${depth2}m`;
                    document.getElementById('depth-range-3').textContent = `${depth2}-${depth3}m`;
                    document.getElementById('depth-range-4').textContent = `>${depth3}m`;
                }

                // 初始化图例显示
                updateLegend(viewModel.waterDepthColorIntensity);

                // 绑定设置渲染边界按钮
                document.getElementById("setBoundaryBtn").addEventListener("click", function () {
                    let handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
                    handler.setInputAction(async (movement) => {
                        if (waterFluid) return;
                        let cartesian = viewer.scene.pickPosition(movement.position);
                        let cartographic = Cesium.Cartographic.fromCartesian(cartesian);
                        let lon = Cesium.Math.toDegrees(cartographic.longitude);
                        let lat = Cesium.Math.toDegrees(cartographic.latitude);

                        {
                                // 从 viewModel 读取边界尺寸
                                const boundaryWidth = Number(viewModel.boundaryWidth);
                                const boundaryHeight = Number(viewModel.boundaryHeight);

                                // 显示加载遮罩层，禁用工具栏
                                const loadingOverlay = document.getElementById('loadingOverlay');
                                const toolbar = document.getElementById('toolbar');
                                loadingOverlay.style.display = 'flex';
                                toolbar.style.pointerEvents = 'none';
                                toolbar.style.opacity = '0.5';

                                console.log('正在预加载地形数据，请稍候...');

                                // 计算边界范围内的采样点（网格采样）- 增加到64x64以获得更密集的采样
                                const sampleSize = 64; // 64x64 网格采样 = 4096个点
                                const positions = [];
                                for (let i = 0; i < sampleSize; i++) {
                                    for (let j = 0; j < sampleSize; j++) {
                                        const offsetX = (i / (sampleSize - 1) - 0.5) * boundaryWidth;
                                        const offsetY = (j / (sampleSize - 1) - 0.5) * boundaryHeight;

                                        // 将米转换为度（粗略估算）
                                        const lonOffset = offsetX / 111320; // 1度经度约111320米
                                        const latOffset = offsetY / 110540; // 1度纬度约110540米

                                        positions.push(Cesium.Cartographic.fromDegrees(
                                            lon + lonOffset,
                                            lat + latOffset
                                        ));
                                    }
                                }

                                // 使用 sampleTerrainMostDetailed 预加载地形
                                try {
                                    await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, positions);
                                    console.log('地形数据加载完成，共采样 ' + positions.length + ' 个点');

                                    // 飞到目标区域确保地形瓦片加载
                                    await viewer.camera.flyTo({
                                        destination: Cesium.Cartesian3.fromDegrees(lon, lat, boundaryHeight * 2),
                                        duration: 0.1,
                                        orientation: {
                                            heading: 0,
                                            pitch: Cesium.Math.toRadians(-90),
                                            roll: 0
                                        }
                                    });

                                    // 等待地形瓦片完全加载
                                    await new Promise(resolve => {
                                        const checkTiles = () => {
                                            if (viewer.scene.globe.tilesLoaded) {
                                                resolve();
                                            } else {
                                                setTimeout(checkTiles, 100);
                                            }
                                        };
                                        checkTiles();
                                    });

                                    console.log('地形瓦片加载完成');
                                } catch (error) {
                                    console.warn('地形数据加载失败，将使用当前可用数据:', error);
                                } finally {
                                    // 隐藏加载遮罩层，恢复工具栏
                                    loadingOverlay.style.display = 'none';
                                    toolbar.style.pointerEvents = 'auto';
                                    toolbar.style.opacity = '1';
                                }

                                waterFluid = new FluidRenderer(viewer, {
                                    lonLat: [lon, lat],
                                    // 纹理尺寸
                                    width: 1024,
                                    height: 1024,
                                    // 渲染范围 - 使用用户设置的边界尺寸
                                    dimensions: new Cesium.Cartesian3(boundaryWidth, boundaryHeight, 1000),
                                    // 归一化高度 最大高与上面的z对齐
                                    minHeight: 0,
                                    maxHeight: 1000
                                });

                                // 初始化持续出水开始时间（因为默认开启持续出水）
                                waterFluid._continuousFlowStartTime = performance.now() / 1000;

                                // 定义参数更新函数
                                function updateParam() {
                                    if (!waterFluid) return;
                                    waterFluid.config.customParams.x = Number(viewModel.param1);
                                    waterFluid.config.customParams.y = Number(viewModel.param2);
                                    waterFluid.config.customParams.z = Number(viewModel.param3);
                                    waterFluid._waterSourceStrength = Number(viewModel.param4);
                                    waterFluid._waterSourceStrength = Number(viewModel.waterSourceStrength);
                                    waterFluid._waterSourceRadius = Number(viewModel.waterSourceRadius);
                                    waterFluid._waterDepthColorIntensity = Number(viewModel.waterDepthColorIntensity);

                                    // 更新图例
                                    updateLegend(waterFluid._waterDepthColorIntensity);

                                    // 更新边界尺寸
                                    const newWidth = Number(viewModel.boundaryWidth);
                                    const newHeight = Number(viewModel.boundaryHeight);
                                    if (newWidth !== waterFluid.config.dimensions.x || newHeight !== waterFluid.config.dimensions.y) {
                                        waterFluid.updateBoundaryDimensions(newWidth, newHeight);
                                    }
                                }

                                // 订阅参数变化
                                for (const name in viewModel) {
                                    if (viewModel.hasOwnProperty(name)) {
                                        Cesium.knockout.getObservable(viewModel, name).subscribe(updateParam);
                                    }
                                }

                                // 添加鼠标点击添加水源功能
                                waterSourceHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
                                waterSourceHandler.setInputAction((movement) => {
                                    if (waterFluid._continuousFlow) {
                                        // 设置持续出水位置
                                        const cartesian = viewer.scene.pickPosition(movement.position);
                                        if (Cesium.defined(cartesian)) {
                                            const center = Cesium.Cartesian3.fromDegrees(...waterFluid.config.lonLat, 0);
                                            const enuMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(center);
                                            const inverseEnu = Cesium.Matrix4.inverse(enuMatrix, new Cesium.Matrix4());
                                            const localPos = Cesium.Matrix4.multiplyByPoint(inverseEnu, cartesian, new Cesium.Cartesian3());
                                            const normalizedU = (localPos.x / waterFluid.config.dimensions.x) + 0.5;
                                            const normalizedV = 1.0 - ((localPos.y / waterFluid.config.dimensions.y) + 0.5);
                                            waterFluid._continuousSourcePos = new Cesium.Cartesian2(normalizedU, normalizedV);
                                            waterFluid._continuousFlowStartTime = performance.now() / 1000;
                                            console.log(`持续出水位置已设置 UV: (${normalizedU.toFixed(3)}, ${normalizedV.toFixed(3)})`);
                                            console.log(`持续出水状态: ${waterFluid._continuousFlow}, 流量: ${waterFluid._flowRate} m³/s`);
                                            console.log(`deltaTime: ${waterFluid._deltaTime.toFixed(4)}s`);
                                        }
                                    } else {
                                        waterFluid.addWaterSource(movement.position);
                                    }
                                }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

                                // 鼠标移动显示水深（添加节流）
                                let lastMouseMoveTime = 0;
                                waterSourceHandler.setInputAction((movement) => {
                                    const now = Date.now();
                                    if (now - lastMouseMoveTime < 100) return; // 节流：每100ms更新一次
                                    lastMouseMoveTime = now;

                                    try {
                                        const depth = waterFluid.getWaterDepthAtScreen(movement.endPosition);
                                        if (depth !== null && depth > 0.001) {
                                            document.getElementById('waterDepth').textContent = depth.toFixed(3);
                                        } else {
                                            document.getElementById('waterDepth').textContent = '--';
                                        }
                                    } catch (e) {
                                        document.getElementById('waterDepth').textContent = '--';
                                    }
                                }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

                                // 绑定复选框事件
                                document.getElementById('allowFlowOutCheckbox').addEventListener('change', function() {
                                    waterFluid._allowFlowOut = this.checked;
                                    console.log('允许水流出边界:', this.checked);
                                });

                                document.getElementById('continuousFlowCheckbox').addEventListener('change', function() {
                                    waterFluid._continuousFlow = this.checked;
                                    console.log('持续出水:', this.checked);
                                    if (this.checked) {
                                        waterFluid._continuousFlowStartTime = performance.now() / 1000;
                                    } else {
                                        waterFluid._continuousSourcePos = new Cesium.Cartesian2(-1, -1);
                                        waterFluid._continuousFlowStartTime = 0;
                                    }
                                });

                                document.getElementById('flowRateInput').addEventListener('input', function() {
                                    waterFluid._flowRate = parseFloat(this.value);
                                    waterFluid._waterSourceStrength = parseFloat(this.value); // 单次点击量等于流量
                                    console.log('流量设置为:', waterFluid._flowRate, 'm³/s');
                                    console.log('单次点击量:', waterFluid._waterSourceStrength, 'm³');
                                });
                            }

                        handler.destroy();
                    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
                });

                // 定位到厦门
                viewer.camera.setView({
                    destination: Cesium.Cartesian3.fromDegrees(118.1, 24.5, 50000),
                    orientation: {
                        heading: Cesium.Math.toRadians(0),
                        pitch: Cesium.Math.toRadians(-45),
                        roll: 0.0
                    }
                });
            }

            /**
             * @description 多缓冲区计算
             */
            const Command = `
// cesium for fluid by mind3d , fluid demo from https://www.shadertoy.com/view/7tSSDD
const int textureSize = 1024;
// Render
const vec3 backgroundColor = vec3(0.2);
// Terrain
uniform sampler2D boundaryMask;
uniform float allowFlowOut;
const float transitionTime = 5.0;
const float transitionPercent = 0.3;
const int octaves = 7;
// Water simulation
// const float attenuation = 0.995;
// const float strenght = 0.25;
 const float minTotalFlow = 0.0001;
const float initialWaterLevel = 0.03;
uniform vec4 fluidParam;
uniform vec4 customParam;
uniform float waterSize;

mat2 rot(in float ang) 
{
   return mat2(
			cos(ang), -sin(ang),
			sin(ang),  cos(ang));
}

// hash from Dave_Hoskins https://www.shadertoy.com/view/4djSRW
float hash12(vec2 p)
{
	vec3 p3  = fract(vec3(p.xyx) * .1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}

float hash13(vec3 p3)
{
	p3  = fract(p3 * .1031);
    p3 += dot(p3, p3.zyx + 31.32);
    return fract((p3.x + p3.y) * p3.z);
}

// Box intersection by IQ https://iquilezles.org/articles/boxfunctions

vec2 boxIntersection( in vec3 ro, in vec3 rd, in vec3 rad, out vec3 oN ) 
{
    vec3 m = 1.0 / rd;
    vec3 n = m * ro;
    vec3 k = abs(m) * rad;
    vec3 t1 = -n - k;
    vec3 t2 = -n + k;

    float tN = max( max( t1.x, t1.y ), t1.z );
    float tF = min( min( t2.x, t2.y ), t2.z );
	
    if( tN > tF || tF < 0.0) return vec2(-1.0); // no intersection
    
    oN = -sign(rd)*step(t1.yzx, t1.xyz) * step(t1.zxy, t1.xyz);

    return vec2( tN, tF );
}

vec2 hitBox(vec3 orig, vec3 dir) {
    const vec3 box_min = vec3(-0.5);
    const vec3 box_max = vec3(0.5);
    vec3 inv_dir = 1.0 / dir;
    vec3 tmin_tmp = (box_min - orig) * inv_dir;
    vec3 tmax_tmp = (box_max - orig) * inv_dir;
    vec3 tmin = min(tmin_tmp, tmax_tmp);
    vec3 tmax = max(tmin_tmp, tmax_tmp);
    float t0 = max(tmin.x, max(tmin.y, tmin.z));
    float t1 = min(tmax.x, min(tmax.y, tmax.z));
    return vec2(t0, t1);
}

// Fog by IQ https://iquilezles.org/articles/fog

vec3 applyFog( in vec3  rgb, vec3 fogColor, in float distance)

vec3 getDepthColor(float waterDepth) {
    // 归一化水深值到 [0, 1] 范围
    float normalizedDepth = clamp(waterDepth * waterDepthColorIntensity * 10.0, 0.0, 1.0);

    vec3 color1 = vec3(0.0, 0.4, 0.9);  // 蓝色 (浅水)
    vec3 color2 = vec3(0.9, 0.9, 0.2);  // 黄色
    vec3 color3 = vec3(1.0, 0.5, 0.0);  // 橙色
    vec3 color4 = vec3(0.9, 0.0, 0.0);  // 红色 (深水)

    vec3 color;
    if (normalizedDepth < 0.33) {
        color = mix(color1, color2, normalizedDepth * 3.0);
    } else if (normalizedDepth < 0.66) {
        color = mix(color2, color3, (normalizedDepth - 0.33) * 3.0);
    } else {
        color = mix(color3, color4, (normalizedDepth - 0.66) * 3.0);
    }

    return color;
}

            class CustomPrimitive {
                constructor(options) {
                    this.commandType = options.commandType;

                    this.geometry = options.geometry;
                    this.attributeLocations = options.attributeLocations;
                    this.primitiveType = options.primitiveType;

                    this.uniformMap = options.uniformMap;

                    this.vertexShaderSource = options.vertexShaderSource;
                    this.fragmentShaderSource = options.fragmentShaderSource;

                    this.rawRenderState = options.rawRenderState;
                    this.framebuffer = options.framebuffer;
                    this.isPostRender = options.isPostRender;

                    this.outputTexture = options.outputTexture;

                    this.autoClear = Cesium.defaultValue(options.autoClear, false);
                    this.preExecute = options.preExecute;

                    this.modelMatrix = Cesium.defaultValue(options.modelMatrix, Cesium.Matrix4.IDENTITY);
                    this.show = true;
                    this.commandToExecute = undefined;
                    this.clearCommand = undefined;
                    if (this.autoClear) {
                        this.clearCommand = new Cesium.ClearCommand({
                            color: new Cesium.Color(0.0, 0.0, 0.0, 0.0),
                            depth: 1.0,
                            framebuffer: this.framebuffer,
                            pass: Cesium.Pass.OPAQUE
                        });
                    }
                }

                createCommand(context) {
                    switch (this.commandType) {
                        case 'Draw': {
                            let vertexArray = Cesium.VertexArray.fromGeometry({
                                context: context,
                                geometry: this.geometry,
                                attributeLocations: this.attributeLocations,
                                bufferUsage: Cesium.BufferUsage.STATIC_DRAW,
                            });

                            let shaderProgram = Cesium.ShaderProgram.fromCache({
                                context: context,
                                attributeLocations: this.attributeLocations,
                                vertexShaderSource: this.vertexShaderSource,
                                fragmentShaderSource: this.fragmentShaderSource
                            });

                            let renderState = Cesium.RenderState.fromCache(this.rawRenderState);
                            return new Cesium.DrawCommand({
                                owner: this,
                                vertexArray: vertexArray,
                                primitiveType: this.primitiveType,
                                uniformMap: this.uniformMap,
                                modelMatrix: this.modelMatrix,
                                shaderProgram: shaderProgram,
                                framebuffer: this.framebuffer,
                                renderState: renderState,
                                pass: Cesium.Pass.OPAQUE
                            });
                        }
                        case 'Compute': {
                            return new Cesium.ComputeCommand({
                                owner: this,
                                fragmentShaderSource: this.fragmentShaderSource,
                                uniformMap: this.uniformMap,
                                outputTexture: this.outputTexture,
                                persists: true
                            });
                        }
                    }
                }

                setGeometry(context, geometry) {
                    this.geometry = geometry;
                    let vertexArray = Cesium.VertexArray.fromGeometry({
                        context: context,
                        geometry: this.geometry,
                        attributeLocations: this.attributeLocations,
                        bufferUsage: Cesium.BufferUsage.STATIC_DRAW,
                    });
                    this.commandToExecute.vertexArray = vertexArray;
                }

                update(frameState) {
                    if (!this.show) {
                        return;
                    }

                    if (!Cesium.defined(this.commandToExecute)) {
                        this.commandToExecute = this.createCommand(frameState.context);
                        this.commandToExecute.isPostRender = this.isPostRender;
                    }

                    if (Cesium.defined(this.preExecute)) {
                        this.preExecute(this);
                    }

                    if (Cesium.defined(this.clearCommand)) {
                        frameState.commandList.push(this.clearCommand);
                    }
                    frameState.commandList.push(this.commandToExecute);
                }

                isDestroyed() {
                    return false;
                }

                destroy() {
                    if (Cesium.defined(this.commandToExecute)) {
                        this.commandToExecute.shaderProgram = this.commandToExecute.shaderProgram && this.commandToExecute.shaderProgram.destroy();
                    }
                    return Cesium.destroyObject(this);
                }
            }
